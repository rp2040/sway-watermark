# 水印嵌入核心参数配置
[edge]
threshold = 20          # Sobel边缘检测阈值
alpha_edge = 0.05       # 边缘区嵌入强度（高，抗干扰）
alpha_smooth = 0.02     # 纯色区嵌入强度（低，隐形）

[template]
width = 400             # 模板宽度
height = 200            # 模板高度
redundancy = 3          # 冗余嵌入次数（3次容错）
pixel_spacing = 8       # 点阵间距（避免重叠）

[device]
id = 0x1A2B3C4D         # 设备ID（16进制）
timestamp_mode = realtime # 时间戳模式：realtime=实时 / fixed=固定
fixed_timestamp = 1718000000 # 固定时间戳（仅fixed模式生效）